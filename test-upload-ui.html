<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📄 RentKeepers - Document Upload Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .header h1 {
      color: #1a1a2e;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .card h2 {
      color: #1a1a2e;
      margin-bottom: 20px;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: 500;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .file-drop-zone {
      border: 3px dashed #e0e0e0;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 15px;
    }

    .file-drop-zone:hover,
    .file-drop-zone.dragover {
      border-color: #667eea;
      background: #f5f3ff;
    }

    .file-drop-zone.has-file {
      border-color: #22c55e;
      background: #f0fdf4;
    }

    .file-drop-zone-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .file-drop-zone-text {
      color: #666;
    }

    .file-drop-zone input[type="file"] {
      display: none;
    }

    .btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
    }

    .btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #6c757d;
    }

    .btn-secondary:hover {
      background: #5a6268;
    }

    .btn-danger {
      background: #dc2626;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }

    .status-message {
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-weight: 500;
    }

    .status-success {
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }

    .status-error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .status-info {
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
    }

    .document-list {
      list-style: none;
      max-height: 400px;
      overflow-y: auto;
    }

    .document-item {
      display: flex;
      align-items: center;
      padding: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: all 0.3s;
    }

    .document-item:hover {
      border-color: #667eea;
      background: #f5f3ff;
    }

    .document-icon {
      font-size: 24px;
      margin-right: 15px;
    }

    .document-info {
      flex: 1;
    }

    .document-name {
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .document-meta {
      font-size: 12px;
      color: #666;
    }

    .document-actions {
      display: flex;
      gap: 8px;
    }

    .document-actions button {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-view {
      background: #3b82f6;
      color: white;
    }

    .btn-view:hover {
      background: #2563eb;
    }

    .btn-download {
      background: #22c55e;
      color: white;
    }

    .btn-download:hover {
      background: #16a34a;
    }

    .btn-delete {
      background: #dc2626;
      color: white;
    }

    .btn-delete:hover {
      background: #b91c1c;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .stat-value {
      font-size: 32px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #666;
      font-size: 14px;
    }

    .category-tag {
      display: inline-block;
      padding: 4px 8px;
      background: #f0f0f0;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }

    .preview-container {
      margin-top: 15px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px;
      background: #f9f9f9;
    }

    .preview-container img {
      max-width: 100%;
      border-radius: 4px;
    }

    .preview-container iframe {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📄 Document Upload Test</h1>
      <p>Test the document upload functionality for RentKeepers</p>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="totalDocs">0</div>
        <div class="stat-label">Total Documents</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalSize">0 KB</div>
        <div class="stat-label">Total Size</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="lastUpload">-</div>
        <div class="stat-label">Last Upload</div>
      </div>
    </div>

    <div class="grid">
      <!-- Upload Form -->
      <div class="card">
        <h2>📤 Upload Document</h2>
        <form id="uploadForm">
          <div class="form-group">
            <label for="title">Document Title</label>
            <input type="text" id="title" name="title" placeholder="e.g., Lease Agreement - Unit 101" required>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="lease">📋 Lease Agreements</option>
              <option value="inspection">🔍 Inspection Reports</option>
              <option value="maintenance">🔧 Maintenance Records</option>
              <option value="payment">💰 Payment Records</option>
              <option value="correspondence">📧 Correspondence</option>
              <option value="legal">⚖️ Legal Documents</option>
              <option value="insurance">🛡️ Insurance</option>
              <option value="general">📁 General</option>
            </select>
          </div>

          <div class="form-group">
            <label for="description">Description (optional)</label>
            <textarea id="description" name="description" rows="3" placeholder="Add any notes about this document..."></textarea>
          </div>

          <div class="form-group">
            <label>Property/Unit (optional)</label>
            <input type="text" id="propertyId" name="propertyId" placeholder="Property ID">
            <input type="text" id="unitId" name="unitId" placeholder="Unit ID" style="margin-top: 8px;">
          </div>

          <div class="file-drop-zone" id="dropZone">
            <div class="file-drop-zone-icon">📎</div>
            <div class="file-drop-zone-text">
              <strong>Click to upload</strong> or drag and drop<br>
              <small>PDF, JPG, PNG, DOC, DOCX (max 10MB)</small>
            </div>
            <input type="file" id="fileInput" name="document" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" required>
          </div>

          <div id="filePreview" class="preview-container" style="display: none;"></div>

          <button type="submit" class="btn" id="uploadBtn">
            📤 Upload Document
          </button>

          <div id="uploadStatus"></div>
        </form>
      </div>

      <!-- Document List -->
      <div class="card">
        <h2>📚 Uploaded Documents</h2>
        <div style="margin-bottom: 15px;">
          <input type="text" id="searchDocs" placeholder="🔍 Search documents..." style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px;">
        </div>
        <ul class="document-list" id="documentList">
          <li style="text-align: center; color: #999; padding: 40px;">
            No documents uploaded yet
          </li>
        </ul>
        <button class="btn btn-secondary" onclick="loadDocuments()" style="margin-top: 15px;">
          🔄 Refresh List
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';
    let documents = [];

    // DOM Elements
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const filePreview = document.getElementById('filePreview');
    const uploadForm = document.getElementById('uploadForm');
    const uploadStatus = document.getElementById('uploadStatus');
    const documentList = document.getElementById('documentList');
    const searchDocs = document.getElementById('searchDocs');

    // File drop zone handlers
    dropZone.addEventListener('click', () => fileInput.click());
    
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        fileInput.files = files;
        showFilePreview(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        showFilePreview(e.target.files[0]);
      }
    });

    function showFilePreview(file) {
      filePreview.style.display = 'block';
      dropZone.classList.add('has-file');
      
      const fileType = file.type;
      const fileSize = (file.size / 1024).toFixed(2);
      
      if (fileType.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (e) => {
          filePreview.innerHTML = `<img src="${e.target.result}" alt="Preview" style="max-height: 200px;">`;
        };
        reader.readAsDataURL(file);
      } else {
        filePreview.innerHTML = `
          <div style="padding: 20px; text-align: center;">
            <div style="font-size: 48px; margin-bottom: 10px;">📄</div>
            <strong>${file.name}</strong><br>
            <small>${fileSize} KB</small>
          </div>
        `;
      }
      
      dropZone.querySelector('.file-drop-zone-text').innerHTML = `
        <strong>✅ ${file.name}</strong><br>
        <small>${fileSize} KB</small>
      `;
    }

    // Upload form handler
    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = new FormData(uploadForm);
      const uploadBtn = document.getElementById('uploadBtn');
      
      uploadBtn.disabled = true;
      uploadBtn.textContent = '⏳ Uploading...';
      
      try {
        const response = await fetch(`${API_BASE}/documents/upload`, {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (response.ok && result.success) {
          uploadStatus.innerHTML = `
            <div class="status-message status-success">
              ✅ ${result.message}
            </div>
          `;
          
          // Update stats
          updateStats();
          
          // Reload document list
          loadDocuments();
          
          // Reset form
          uploadForm.reset();
          dropZone.classList.remove('has-file');
          filePreview.style.display = 'none';
          dropZone.querySelector('.file-drop-zone-text').innerHTML = `
            <strong>Click to upload</strong> or drag and drop<br>
            <small>PDF, JPG, PNG, DOC, DOCX (max 10MB)</small>
          `;
        } else {
          throw new Error(result.error || 'Upload failed');
        }
      } catch (error) {
        uploadStatus.innerHTML = `
          <div class="status-message status-error">
            ❌ ${error.message}
          </div>
        `;
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = '📤 Upload Document';
      }
    });

    // Load documents
    async function loadDocuments() {
      try {
        const response = await fetch(`${API_BASE}/documents`);
        const data = await response.json();
        
        documents = data.documents || [];
        renderDocumentList(documents);
        updateStats();
      } catch (error) {
        console.error('Failed to load documents:', error);
        documentList.innerHTML = `
          <li style="text-align: center; color: #dc2626; padding: 40px;">
            ❌ Failed to load documents. Make sure the server is running.
          </li>
        `;
      }
    }

    // Render document list
    function renderDocumentList(docs) {
      if (docs.length === 0) {
        documentList.innerHTML = `
          <li style="text-align: center; color: #999; padding: 40px;">
            No documents uploaded yet
          </li>
        `;
        return;
      }

      documentList.innerHTML = docs.map(doc => {
        const icon = getFileIcon(doc.filename);
        const size = (doc.size / 1024).toFixed(1);
        
        return `
          <li class="document-item">
            <div class="document-icon">${icon}</div>
            <div class="document-info">
              <div class="document-name">${doc.title || doc.filename}</div>
              <div class="document-meta">${size} KB • ${new Date(doc.uploadedAt).toLocaleDateString()}</div>
              ${doc.category ? `<span class="category-tag">${doc.category}</span>` : ''}
            </div>
            <div class="document-actions">
              <button class="btn-view" onclick="viewDocument(${doc.id})">👁️</button>
              <button class="btn-download" onclick="downloadDocument(${doc.id})">⬇️</button>
              <button class="btn-delete" onclick="deleteDocument(${doc.id})">🗑️</button>
            </div>
          </li>
        `;
      }).join('');
    }

    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      const icons = {
        pdf: '📄',
        jpg: '🖼️',
        jpeg: '🖼️',
        png: '🖼️',
        doc: '📝',
        docx: '📝'
      };
      return icons[ext] || '📁';
    }

    // View document
    async function viewDocument(id) {
      window.open(`${API_BASE}/documents/view/${id}`, '_blank');
    }

    // Download document
    async function downloadDocument(id) {
      window.open(`${API_BASE}/documents/download/${id}`, '_blank');
    }

    // Delete document
    async function deleteDocument(id) {
      if (!confirm('Are you sure you want to delete this document?')) {
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/documents/${id}`, {
          method: 'DELETE'
        });

        const result = await response.json();

        if (response.ok && result.success) {
          loadDocuments();
          updateStats();
        } else {
          alert('Failed to delete document: ' + result.error);
        }
      } catch (error) {
        alert('Failed to delete document: ' + error.message);
      }
    }

    // Search documents
    searchDocs.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = documents.filter(doc => 
        doc.title.toLowerCase().includes(query) ||
        doc.filename.toLowerCase().includes(query)
      );
      renderDocumentList(filtered);
    });

    // Update stats
    function updateStats() {
      const total = documents.length;
      const totalSize = documents.reduce((sum, doc) => sum + doc.size, 0);
      const lastUpload = documents.length > 0 ? 
        new Date(documents[documents.length - 1].uploadedAt).toLocaleDateString() : '-';

      document.getElementById('totalDocs').textContent = total;
      document.getElementById('totalSize').textContent = (totalSize / 1024).toFixed(1) + ' KB';
      document.getElementById('lastUpload').textContent = lastUpload;
    }

    // Initial load
    loadDocuments();
  </script>
</body>
</html>
