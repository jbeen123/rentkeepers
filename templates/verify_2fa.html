{% extends "base.html" %}

{% block title %}Verify 2FA - RentKeepers{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header text-center">
                <h4 class="mb-0"><i class="bi bi-shield-lock-fill me-2"></i>Two-Factor Authentication</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted text-center mb-4">
                    Enter the 6-digit code from your authenticator app.
                </p>
                
                <form method="POST">
                    <div class="mb-4">
                        <label for="token" class="form-label">Verification Code</label>
                        <input type="text" class="form-control form-control-lg text-center" 
                               id="token" name="token" 
                               placeholder="000000" 
                               maxlength="6"
                               pattern="[0-9]*"
                               inputmode="numeric"
                               autocomplete="one-time-code"
                               required autofocus>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 btn-lg">
                        <i class="bi bi-shield-check me-2"></i>Verify
                    </button>
                </form>
                
                <hr class="my-4">
                
                <div class="text-center">
                    <a href="{{ url_for('login') }}" class="text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>Back to login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
